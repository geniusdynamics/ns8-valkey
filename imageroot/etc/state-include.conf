#
# Restic backup of ns8-valkey (state/environment is always included)
#
# - secrets.env: passwords of the module Valkey users (0600)
# - tls/ca.*: CA of the cluster bus
# - valkey-data: dump.rdb written by module-dump-state and users.acl (the
#   client users, as SHA-256 hashes). See state-exclude.conf.
#
state/secrets.env
state/tls/ca.crt
state/tls/ca.key
volumes/valkey-data
